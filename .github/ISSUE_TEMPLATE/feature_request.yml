name: 功能建议 / Feature Request
description: 提出新功能想法或交互体验改进建议 / Suggest a feature or UX improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: 适用平台 / Platform
      options:
        - Windows x64
        - Android
        - Windows + Android
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与痛点 / Problem or Use Case
      description: 希望解决什么问题，或目前哪个流程不够顺畅？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案 / Proposed Solution
      description: 描述你期望的交互方式或功能表现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案或补充说明 / Alternatives & Context
      description: 可选：是否与其他功能或协议配置存在关联？
