<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/air-m1.svg?no-inline" />
    <title>Air Proxy</title>
    <script src="/boot-theme.js"></script>
    <style>
      html, body, #app {
        height: 100%;
        margin: 0;
        background: #f3f5f9;
        color: #141d2e;
      }
      html.dark,
      html[data-theme="dark"],
      html.dark body,
      html[data-theme="dark"] body,
      html.dark #app,
      html[data-theme="dark"] #app {
        background: #161618;
        color: #f4f4f5;
      }
      .air-boot {
        position: fixed;
        inset: 0;
        z-index: 90;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        background: #f3f5f9;
        color: #141d2e;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        user-select: none;
        opacity: 1;
        transform: scale(1);
        transition:
          opacity 260ms cubic-bezier(0.22, 1, 0.36, 1),
          transform 260ms cubic-bezier(0.22, 1, 0.36, 1);
        will-change: opacity, transform;
      }
      .air-boot.air-boot-leaving {
        opacity: 0;
        transform: scale(1.025);
        pointer-events: none;
      }
      html.dark .air-boot,
      html[data-theme="dark"] .air-boot {
        background: #161618;
        color: #f4f4f5;
      }
      .air-boot-mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 88px;
        height: 88px;
      }
      .air-boot-glow {
        position: absolute;
        inset: 4px;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(41, 86, 212, 0.24) 0%, transparent 72%);
        animation: air-boot-pulse 2.2s ease-in-out infinite;
      }
      html.dark .air-boot-glow,
      html[data-theme="dark"] .air-boot-glow {
        background: radial-gradient(circle, rgba(163, 184, 255, 0.24) 0%, transparent 72%);
      }
      .air-boot-logo {
        position: relative;
        width: 68px;
        height: 68px;
        animation: air-boot-float 2.4s ease-in-out infinite;
      }
      .air-boot-title {
        font-size: 20px;
        font-weight: 720;
        letter-spacing: -0.03em;
      }
      .air-boot-bar {
        position: relative;
        width: 96px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: #edf1f7;
      }
      html.dark .air-boot-bar,
      html[data-theme="dark"] .air-boot-bar {
        background: #232328;
      }
      .air-boot-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 44%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, #2956d4, transparent);
        animation: air-boot-slide 1.2s ease-in-out infinite;
      }
      html.dark .air-boot-bar::after,
      html[data-theme="dark"] .air-boot-bar::after {
        background: linear-gradient(90deg, transparent, #a3b8ff, transparent);
      }
      @keyframes air-boot-float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-4px) scale(1.03); }
      }
      @keyframes air-boot-pulse {
        0%, 100% { opacity: 0.65; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      @keyframes air-boot-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .air-boot { transition: none; }
        .air-boot-logo, .air-boot-glow { animation: none; }
        .air-boot-bar::after { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="air-boot" class="air-boot" data-tauri-drag-region aria-hidden="true">
        <div class="air-boot-mark" data-tauri-drag-region>
          <div class="air-boot-glow"></div>
          <svg class="air-boot-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
            <defs>
              <clipPath id="desktop-boot-cut"><path d="M7 34L61 13Q65 11 64 16L53 58Q52 63 48 60L33.8 48L42.3 30.4L23.4 42.4L8 39Q2 37 7 34ZM21.6 46.8L35.8 37.65Q36.7 37.1 36.25 38.15L30.25 51.55Q30.05 52.05 29.56 52.28L22.1 55.55Q21.35 55.9 21.38 55.1Z"/></clipPath>
              <linearGradient id="desktop-boot-wing" x1="16" y1="17" x2="47" y2="64" gradientUnits="userSpaceOnUse"><stop stop-color="#8AD1FA"/><stop offset=".53" stop-color="#4698DF"/><stop offset="1" stop-color="#2466B9"/></linearGradient>
              <linearGradient id="desktop-boot-body" x1="47" y1="16" x2="57" y2="62" gradientUnits="userSpaceOnUse"><stop stop-color="#3488D8"/><stop offset=".53" stop-color="#276DC0"/><stop offset="1" stop-color="#174F9B"/></linearGradient>
              <radialGradient id="desktop-boot-soft" gradientUnits="userSpaceOnUse" cx="36" cy="30" r="31" gradientTransform="translate(0 10.2) scale(1 .66)"><stop stop-color="#92CFFD" stop-opacity="0.16"/><stop offset=".52" stop-color="#92CFFD" stop-opacity="0.0688"/><stop offset="1" stop-color="#92CFFD" stop-opacity="0"/></radialGradient>
            </defs>
            <path d="M7 34L61 13Q65 11 64 16L53 58Q52 63 48 60L33.8 48L42.3 30.4L23.4 42.4L8 39Q2 37 7 34ZM21.6 46.8L35.8 37.65Q36.7 37.1 36.25 38.15L30.25 51.55Q30.05 52.05 29.56 52.28L22.1 55.55Q21.35 55.9 21.38 55.1Z" transform="translate(.45 1.25)" fill="#164C92"/>
            <path d="M7 34L61 13Q65 11 64 16L53 58Q52 63 48 60L33.8 48L42.3 30.4L23.4 42.4L8 39Q2 37 7 34ZM21.6 46.8L35.8 37.65Q36.7 37.1 36.25 38.15L30.25 51.55Q30.05 52.05 29.56 52.28L22.1 55.55Q21.35 55.9 21.38 55.1Z" fill="url(#desktop-boot-wing)"/>
            <g clip-path="url(#desktop-boot-cut)">
              <path d="M65 12L23.4 42.4L19 48L19 64L33 64L55 65Z" fill="url(#desktop-boot-body)"/>
              <path d="M64 13L35.8 42.3L32.7 48.8L51.9 62.4L52 62Z" fill="#164C92" opacity=".43"/>
              <path d="M23 47.0L33.4 40.3" fill="none" stroke="#7CC2F3" stroke-opacity=".47" stroke-width=".46" stroke-linecap="round"/>
              <path d="M7 34L61 13Q65 11 64 16L53 58Q52 63 48 60L33.8 48L42.3 30.4L23.4 42.4L8 39Q2 37 7 34ZM21.6 46.8L35.8 37.65Q36.7 37.1 36.25 38.15L30.25 51.55Q30.05 52.05 29.56 52.28L22.1 55.55Q21.35 55.9 21.38 55.1Z" fill="url(#desktop-boot-soft)"/>
            </g>
            <path d="M7 34L61 13Q65 11 64 16L53 58Q52 63 48 60L33.8 48L42.3 30.4L23.4 42.4L8 39Q2 37 7 34ZM21.6 46.8L35.8 37.65Q36.7 37.1 36.25 38.15L30.25 51.55Q30.05 52.05 29.56 52.28L22.1 55.55Q21.35 55.9 21.38 55.1Z" fill="none" stroke="#72B2EC" stroke-opacity="0.29" stroke-width=".45" stroke-linejoin="round"/>
          </svg>
        </div>
      <strong class="air-boot-title">Air Proxy</strong>
      <div class="air-boot-bar"></div>
    </div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
