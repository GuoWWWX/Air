<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-src 'none'" />
    <title>Air Proxy</title>
    <script src="./boot-theme.js"></script>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #f6f8fc; color: #1b2435; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]),
        html:not([data-theme="light"]) body,
        html:not([data-theme="light"]) #root { background: #161618; color: #f4f4f5; }
      }
      html[data-theme="dark"], html[data-theme="dark"] body, html[data-theme="dark"] #root { background: #161618; color: #f4f4f5; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
